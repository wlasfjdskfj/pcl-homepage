name: Generate Custom.xaml

on:
  # 定时触发：每小时的第 0 分钟运行一次
  schedule:
    - cron: '0 * * * *'
  # 手动触发：在 GitHub 仓库页面点按钮就能跑
  workflow_dispatch:
  # 推送到 main 分支时也触发
  push:
    branches:
      - main

# 给 Actions 写权限，否则无法提交
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行生成脚本
        run: python scripts/generate.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Custom.xaml
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "自动更新 Custom.xaml $(date -u +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
