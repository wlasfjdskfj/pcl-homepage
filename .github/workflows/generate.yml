name: Generate Custom.xaml

on:
  # 每 12 小时跑一次（北京时间 0 点和 12 点）
  schedule:
    - cron: '0 16,4 * * *'
  # 手动触发
  workflow_dispatch:
  # 推送到 main 分支时触发
  # 注意：排除生成物，否则机器人的“每日更新”提交会再次触发本工作流，
  # 造成每次定时任务都白白多跑一轮（并发组会取消后一轮，但事件仍会被创建）。
  push:
    branches:
      - main
    paths-ignore:
      - 'Custom.xaml'
      - 'Custom.xaml.version'
      - 'panel.xaml'
      - 'panel.json'
      - 'images/version.png'
      - 'images/version.png.version'
      - 'README.md'
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: generate-custom-xaml
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 校验占位符一致性
        run: python scripts/check_placeholders.py
        env:
          PYTHONIOENCODING: utf-8

      - name: 校验模板与生成物一致
        run: python scripts/check_templates.py
        env:
          PYTHONIOENCODING: utf-8

      - name: 校验 ES 模块引用
        run: python scripts/check_imports.py
        env:
          PYTHONIOENCODING: utf-8

      - name: 运行生成脚本
        run: python scripts/generate.py
        env:
          PYTHONIOENCODING: utf-8

      - name: 生成后再校验一次
        run: |
          python scripts/check_templates.py
          python scripts/check_placeholders.py
        env:
          PYTHONIOENCODING: utf-8

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Custom.xaml
          git add Custom.xaml.version || true
          git add panel.xaml || true
          git add panel.json || true
          git add images/ || true
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "每日更新 Custom.xaml $(date -u +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
