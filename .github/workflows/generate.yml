name: Generate Custom.xaml

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: generate-custom-xaml
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 运行生成脚本
        run: python scripts/generate.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Custom.xaml
          git add images/ || true
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "自动更新 Custom.xaml 及图片 $(date -u +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
