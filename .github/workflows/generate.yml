name: Generate Custom.xaml

on:
  # 每 2 小时更新一次，控制在 Cloudflare Pages 免费构建额度内
  schedule:
    - cron: '0 */2 * * *'
  # 手动触发
  workflow_dispatch:
  # 推送到 main 分支时也触发
  push:
    branches:
      - main

# 权限最小化：只给读代码 + 写 Custom.xaml 所需的权限
permissions:
  contents: write

# 并发限制：同一时间只允许一个 workflow 运行
concurrency:
  group: generate-custom-xaml
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    # 超时限制：5 分钟没跑完就自动杀掉
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: ''

      - name: 运行生成脚本
        run: python scripts/generate.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Custom.xaml
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "自动更新 Custom.xaml $(date -u +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
