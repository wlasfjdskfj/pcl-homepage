name: Generate Custom.xaml

on:
  # 每天 UTC 0 点（北京时间 8 点）自动更新
  schedule:
    - cron: '0 0 * * *'
  # 手动触发
  workflow_dispatch:
  # 推送到 main 分支时触发
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: generate-custom-xaml
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行生成脚本
        run: python scripts/generate.py
        env:
          PYTHONIOENCODING: utf-8

      - name: 检查生成结果
        run: |
          if [ ! -f Custom.xaml ]; then
            echo "::error::Custom.xaml 未生成"
            exit 1
          fi
          SIZE=$(wc -c < Custom.xaml)
          echo "Custom.xaml 大小：$SIZE 字节"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Custom.xaml 内容过小，可能生成失败"
            exit 1
          fi

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Custom.xaml
          git add images/ || true
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "每日更新 Custom.xaml $(date -u +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
